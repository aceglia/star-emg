
name: Run the tests

# on: [pull_request]
on:
  push:
    branches: [main] 
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            label: linux-64
            prefix: /usr/share/miniconda3/envs/star-emg
          - os: macos-latest
            label: osx-64
            prefix: /Users/runner/miniconda3/envs/star-emg
          - os: windows-latest
            label: win-64
            prefix: C:\Miniconda3\envs\star-emg
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-variant: Mambaforge
          miniforge-version: latest
          use-mamba: true
          activate-environment: star-emg
          environment-file: environment.yml
        
      - name: Print mamba info
        run: | 
          mamba config --show
          mamba info
          mamba list
          
      - name: Install extra dependencies
        run: mamba install black pytest -cconda-forge

      - name: Run the actual tests
        run: pytest tests/

          
      - name: Test installed version of star-emg
        run: | 
          pip install .
          cd
          python -c "import start_emg"
