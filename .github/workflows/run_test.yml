name: Run the tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: star_emg
          environment-file: environment.yml
          auto-activate-base: false

      - name: Show environment info
        run: |
          conda info
          conda list

      - name: Install package and test tools
        run: |
          pip install . --no-deps
          conda install -c conda-forge pytest black

      - name: Run the tests
        run: pytest tests/

      - name: Test installed version outside the repo
        run: |
          cd "$RUNNER_TEMP"
          python -c "import star_emg; print(star_emg.__file__)"