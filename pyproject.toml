[project]
name = "star_emg"
version = "0.0.1"
authors = [
  { name="Amedeo ceglia", email="amedeo.ceglia@umontreal.ca" },
]
description = "Package for Stimulation Artifact Removal in EMG during transcutaneous spinal stimulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" } 
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy",
    "pyqtgraph",
    "PyQt5",
    "biosiglive>=2.0.3",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[project.urls]
"Homepage" = "https://github.com/aceglia/star-emg"
"Bug Tracker" = "https://github.com/aceglia/star-emg/issues"

[tool.setuptools.packages.find]
include = ["star_emg*"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
